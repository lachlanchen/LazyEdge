name: Validate or publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm release compatible with OIDC trusted publishing
        run: |
          npm install --global npm@^11.10.0
          npm --version
      - name: Reject GitHub pre-releases
        if: github.event_name == 'release' && github.event.release.prerelease
        run: |
          echo "::error::Publish a stable GitHub release for a stable npm version."
          exit 1
      - name: Verify package, lock, citation, and release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/verify-release-metadata.mjs --tag "$RELEASE_TAG"
          else
            node scripts/verify-release-metadata.mjs
          fi
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Audit npm package contents
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/lazyedge-pack.json"
          node --input-type=module - "$RUNNER_TEMP/lazyedge-pack.json" <<'NODE'
          import { readFile } from "node:fs/promises";
          const report = JSON.parse(await readFile(process.argv[2], "utf8"));
          const files = report.flatMap((entry) => entry.files ?? []).map((entry) => entry.path);
          const forbidden = files.filter((file) =>
            /(^|\/)references\/private(\/|$)/i.test(file)
            || (/(^|\/)\.env(?:\.|$)/i.test(file) && file !== ".env.example")
            || /(^|\/)(?:\.npmrc|cookies?|login data|history)$/i.test(file)
            || /\.(?:pem|key|p12|pfx|log)$/i.test(file)
            || /(^|\/)(?:\.lazyedge|coverage|tmp|cache)(\/|$)/i.test(file)
          );
          if (forbidden.length > 0) throw new Error(`Forbidden package files:\n${forbidden.join("\n")}`);
          process.stdout.write(`Audited ${files.length} package files.\n`);
          NODE
      - name: Require an unpublished npm version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node scripts/verify-release-metadata.mjs
          --tag "$RELEASE_TAG"
          --require-unpublished

  publish:
    name: Publish trusted release
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm release compatible with OIDC trusted publishing
        run: npm install --global npm@^11.10.0
      - name: Recheck immutable release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-metadata.mjs --tag "$RELEASE_TAG"
      - name: Recheck that the npm version is unpublished
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node scripts/verify-release-metadata.mjs
          --tag "$RELEASE_TAG"
          --require-unpublished
      - name: Publish with npm trusted publishing
        run: npm publish --access public --provenance
